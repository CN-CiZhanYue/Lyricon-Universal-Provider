name: Build Lyricon Universal Provider
on:
  push: { branches: [ main, master ] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: wrapper }
      - run: ./gradlew :universal-provider-lyricon:assembleDebug --build-cache --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: universal-provider-lyricon-debug
          path: universal-provider-lyricon/build/outputs/apk/debug/*.apk
          if-no-files-found: error
