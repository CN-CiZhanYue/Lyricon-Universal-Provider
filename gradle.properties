#
# Gradle launches Windows test workers through @argfiles. COMPAT keeps those
# files readable when the workspace path contains non-ASCII characters.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=COMPAT -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# ==============================================
# 2. Gradle Core Optimization
# ==============================================
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# ==============================================
# 3. Kotlin Compilation Optimization
# ==============================================
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.compiler.execution.strategy=in-process
# ==============================================
# 4. Android Project Core Optimization
# ==============================================
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableIncrementalAnnotationProcessing=true
android.enableR8Incremental=true
android.overridePathCheck=true
